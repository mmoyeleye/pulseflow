AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hospital Queue MVP - Minimal Version

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs18.x
    Environment:
      Variables:
        ENCOUNTERS_TABLE: !Ref EncountersTable
        EVENTS_TABLE: !Ref EventsTable
        AUDIT_TABLE: !Ref AuditEventsTable

Parameters:
  Environment:
    Type: String
    Default: dev

Resources:
  # DynamoDB Tables
  EncountersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'hospital-queue-encounters-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'hospital-queue-events-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH

  AuditEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'hospital-queue-audit-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: auditId
          AttributeType: S
      KeySchema:
        - AttributeName: auditId
          KeyType: HASH

  # API Gateway
  HospitalQueueAPI:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'hospital-queue-api-${Environment}'
      StageName: !Ref Environment

  # Lambda Functions
  CheckInFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hospital-queue-checkin-${Environment}'
      CodeUri: backend/lambdas/checkin/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EncountersTable
      Events:
        CheckInAPI:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalQueueAPI
            Path: /checkin
            Method: POST

  GetQueueFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hospital-queue-get-queue-${Environment}'
      CodeUri: backend/lambdas/get-queue/
      Handler: index.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EncountersTable
      Events:
        GetQueueAPI:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalQueueAPI
            Path: /queue/{dept}
            Method: GET

  GetPatientFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hospital-queue-get-patient-${Environment}'
      CodeUri: backend/lambdas/get-patient/
      Handler: index.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EncountersTable
      Events:
        GetPatientAPI:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalQueueAPI
            Path: /patients/{id}
            Method: GET

  CallNextFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hospital-queue-call-next-${Environment}'
      CodeUri: backend/lambdas/call-next/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EncountersTable
      Events:
        CallNextAPI:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalQueueAPI
            Path: /queue/{dept}/call-next
            Method: POST

  UpdatePatientStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hospital-queue-update-status-${Environment}'
      CodeUri: backend/lambdas/update-status/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EncountersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditEventsTable
      Events:
        UpdateStatusAPI:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalQueueAPI
            Path: /patients/{id}/status
            Method: PATCH

  SyncEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hospital-queue-sync-events-${Environment}'
      CodeUri: backend/lambdas/sync-events/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EncountersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditEventsTable
      Events:
        SyncAPI:
          Type: Api
          Properties:
            RestApiId: !Ref HospitalQueueAPI
            Path: /sync/events
            Method: POST

Outputs:
  APIEndpoint:
    Value: !Sub 'https://${HospitalQueueAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  EncountersTable:
    Value: !Ref EncountersTable
  EventsTable:
    Value: !Ref EventsTable
  AuditTable:
    Value: !Ref AuditEventsTable